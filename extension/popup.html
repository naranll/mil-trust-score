<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <style>
    :root { --ink:#22303a; --mute:#5b6b75; --line:rgba(34,48,58,.12); --bg:#eef2f1; --card:rgba(255,255,255,.72);
            --ok:#2f7d5b; --warn:#b7791f; --stop:#b4423a; --ad:#6b5ca5; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6ecef; --mute:#a9b6be; --line:rgba(255,255,255,.12); --bg:#1c2023; --card:rgba(255,255,255,.05);
              --ok:#6cc79e; --warn:#e3b05a; --stop:#f08a80; --ad:#a99be6; } }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
           font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); }
    .ok .dot { background: var(--ok); } .bad .dot { background: var(--stop); }
    .bad { color: var(--stop); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .grid b { display: block; font-size: 18px; font-weight: 650; }
    .grid span { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--mute); font-size: 11.5px; white-space: nowrap; }
    .grid svg { width: 14px; height: 14px; vertical-align: -2px; }
    .meta { margin-top: 6px; color: var(--mute); font-size: 12px; }
    .legend { margin: 0; padding: 0; list-style: none; }
    .legend li { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
    .legend svg { flex: none; width: 13px; height: 13px; transform: translateY(2px); }
    label { display: block; font-size: 12px; color: var(--mute); margin-bottom: 4px; }
    .row { display: flex; gap: 6px; }
    input { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px;
            background: transparent; color: var(--ink); font: inherit; }
    button { height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
             color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { border-color: var(--mute); }
    :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
    .link { border: 0; height: auto; padding: 0; color: var(--mute); font-weight: 400; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="var(--ad)" d="M8 1l5.5 2v4.2c0 3.4-2.3 6.3-5.5 7.3-3.2-1-5.5-3.9-5.5-7.3V3z"/><path d="M5.4 8.1l1.8 1.8 3.5-3.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Итгэлцлийн оноо
  </h1>

  <div id="st" class="card status"><span class="dot"></span><span id="st-text">Сервер шалгаж байна…</span></div>

  <div class="card">
    <div id="stats" class="grid"></div>
    <div id="stats-meta" class="meta"></div>
  </div>

  <div class="card">
    <ul class="legend">
      <li><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="var(--ok)"/></svg><span>Анхааруулах шинж илрээгүй, эх сурвалж нь бүртгэлтэй</span></li>
      <li><svg viewBox="0 0 16 16"><path d="M8 1.6l6.6 11.6H1.4z" fill="var(--warn)"/></svg><span>Эх сурвалжийг шалгаарай</span></li>
      <li><svg viewBox="0 0 16 16"><path d="M5.2 1.2h5.6l4 4v5.6l-4 4H5.2l-4-4V5.2z" fill="var(--stop)"/></svg><span>Анхааруулах дохиотой</span></li>
      <li><svg viewBox="0 0 16 16"><path d="M1.5 4.2A1.7 1.7 0 0 1 3.2 2.5h6.1l5.2 5.5-5.2 5.5H3.2a1.7 1.7 0 0 1-1.7-1.7z" fill="var(--ad)"/></svg><span>Зар: үнэн гэж батлагддаггүй, луйврын шинжийг харуулна</span></li>
    </ul>
    <p class="meta">Тэмдэггүй пост бол шалгагдаагүй (энгийн пост, хэт богино, гадаад хэл), «үнэн» гэсэн үг биш.</p>
  </div>

  <div class="card">
    <label for="api">Серверийн хаяг</label>
    <div class="row"><input id="api" placeholder="http://127.0.0.1:8000"><button id="save">Хадгалах</button></div>
    <p class="meta"><button id="reset" class="link">Статистикийг тэглэх</button></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
